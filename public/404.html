<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ShareNotes — Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects 404 paths to index.html with appropriate hash route
      var pathSegmentsToKeep = 1; // 1 for repo name /Online_Notes_Sharing/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting to ShareNotes...
  </body>
</html>
